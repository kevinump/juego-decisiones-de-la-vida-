<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Decisiones Multijugador</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px; }
    h1, h2 { color: #00e676; margin-top: 0; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; font-size: 16px; }
    button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; background: #00e676; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #00b359; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    .room-code { font-size: 24px; font-weight: bold; color: #00e676; letter-spacing: 2px; }
    .player-list { text-align: left; background: #2a2a2a; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; }
    .player-item { padding: 6px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    .player-item:last-child { border-bottom: none; }
    .current-turn { color: #ffeb3b; font-weight: bold; margin: 15px 0; }
    .hidden { display: none; }
  </style>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuración extraída de tu Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAlavxNK9zUVKgsurezPuQb6kGqkiMoOV8",
      authDomain: "juego-de-decisiones-952a3.firebaseapp.com",
      databaseURL: "https://juego-de-decisiones-952a3-default-rtdb.firebaseio.com",
      projectId: "juego-de-decisiones-952a3",
      storageBucket: "juego-de-decisiones-952a3.firebasestorage.app",
      messagingSenderId: "421666470468",
      appId: "1:421666470468:web:c6367107efd62cbe265a11"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let roomCode = null;
    let playerId = null;
    let playerName = "";

    // Elementos DOM
    const screenLogin = document.getElementById('screen-login');
    const screenLobby = document.getElementById('screen-lobby');
    const screenGame = document.getElementById('screen-game');
    const inputName = document.getElementById('input-name');
    const inputRoom = document.getElementById('input-room');
    const displayRoomCode = document.getElementById('display-room-code');
    const playerListLobby = document.getElementById('player-list-lobby');
    const turnDisplay = document.getElementById('turn-display');
    const diceResult = document.getElementById('dice-result');
    const btnRoll = document.getElementById('btn-roll');

    // Función auxiliar para generar códigos de sala
    function generateCode() {
      return Math.random().toString(36).substring(2, 7).toUpperCase();
    }

    // Validar Nombre
    function getValidName() {
      const name = inputName.value.trim();
      if (!name) {
        alert("Por favor escribe un nombre.");
        return null;
      }
      return name.substring(0, 20); // Límite máximo de 20 caracteres
    }

    // Crear Sala
    window.createRoom = async function() {
      playerName = getValidName();
      if (!playerName) return;

      roomCode = generateCode();
      playerId = "p_1";

      const roomRef = ref(db, 'rooms/' + roomCode);
      await set(roomRef, {
        state: 'waiting',
        currentTurn: 1,
        players: {
          p_1: { id: "p_1", name: playerName, position: 0, order: 1 }
        }
      });

      listenToRoom();
      showScreen(screenLobby);
      displayRoomCode.innerText = roomCode;
    };

    // Unirse a Sala
    window.joinRoom = async function() {
      playerName = getValidName();
      if (!playerName) return;

      const code = inputRoom.value.trim().toUpperCase();
      if (!code) {
        alert("Ingresa un código de sala.");
        return;
      }

      const roomRef = ref(db, 'rooms/' + code);
      const snapshot = await get(roomRef);

      if (!snapshot.exists()) {
        alert("La sala no existe.");
        return;
      }

      const data = snapshot.val();
      const players = data.players || {};
      const count = Object.keys(players).length;

      if (count >= 15) {
        alert("La sala ya está llena (máximo 15 jugadores).");
        return;
      }

      roomCode = code;
      const nextOrder = count + 1;
      playerId = `p_${nextOrder}`;

      await update(ref(db, `rooms/${roomCode}/players/${playerId}`), {
        id: playerId,
        name: playerName,
        position: 0,
        order: nextOrder
      });

      listenToRoom();
      showScreen(screenLobby);
      displayRoomCode.innerText = roomCode;
    };

    // Iniciar Juego (Solo Host)
    window.startGame = async function() {
      await update(ref(db, `rooms/${roomCode}`), { state: 'playing' });
    };

    // Escuchar cambios de la sala en tiempo real
    function listenToRoom() {
      const roomRef = ref(db, 'rooms/' + roomCode);
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const players = Object.values(data.players || {});
        
        // Renderizar lista de jugadores en Lobby
        playerListLobby.innerHTML = players.map(p => 
          `<div class="player-item"><span>${p.name}</span> <b>#${p.order}</b></div>`
        ).join('');

        // Transición al juego
        if (data.state === 'playing') {
          showScreen(screenGame);
          renderGameScreen(data, players);
        }
      });
    }

    // Actualizar pantalla del juego
    function renderGameScreen(roomData, players) {
      const currentTurnOrder = roomData.currentTurn;
      const currentPlayer = players.find(p => p.order === currentTurnOrder);

      if (currentPlayer) {
        turnDisplay.innerText = `Turno de: ${currentPlayer.name}`;
        btnRoll.disabled = (currentPlayer.id !== playerId);
      }

      const playerBoard = document.getElementById('player-board');
      playerBoard.innerHTML = players.map(p => 
        `<div class="player-item"><span>${p.name}</span> <span>Casilla: ${p.position}</span></div>`
      ).join('');
    }

    // Lanzar Dado
    window.rollDice = async function() {
      btnRoll.disabled = true;
      const roll = Math.floor(Math.random() * 6) + 1;
      diceResult.innerText = `🎲 Sacaste un ${roll}`;

      const roomRef = ref(db, 'rooms/' + roomCode);
      const snapshot = await get(roomRef);
      const data = snapshot.val();
      const players = Object.values(data.players || {});
      
      const me = players.find(p => p.id === playerId);
      const newPosition = (me.position || 0) + roll;
      const totalPlayers = players.length;
      let nextTurn = data.currentTurn + 1;
      if (nextTurn > totalPlayers) nextTurn = 1;

      const updates = {};
      updates[`rooms/${roomCode}/players/${playerId}/position`] = newPosition;
      updates[`rooms/${roomCode}/currentTurn`] = nextTurn;

      await update(ref(db), updates);
    };

    function showScreen(screen) {
      screenLogin.classList.add('hidden');
      screenLobby.classList.add('hidden');
      screenGame.classList.add('hidden');
      screen.classList.remove('hidden');
    }
  </script>
</head>
<body>

  <!-- Pantalla 1: Registro e Ingreso -->
  <div id="screen-login" class="card">
    <h1>Juego de Decisiones</h1>
    <p>Ingresa tu nombre para jugar</p>
    <input type="text" id="input-name" placeholder="Tu nombre (máx 20 caracteres)" maxlength="20">
    <hr style="border-color: #333; margin: 15px 0;">
    <button onclick="createRoom()">Crear nueva sala (Host)</button>
    <p>O únete a una existente:</p>
    <input type="text" id="input-room" placeholder="Código de la sala (ej: A1B2C)">
    <button onclick="joinRoom()">Unirme a la sala</button>
  </div>

  <!-- Pantalla 2: Sala de Espera (Lobby) -->
  <div id="screen-lobby" class="card hidden">
    <h2>Sala de Espera</h2>
    <p>Comparte este código con tus amigos (hasta 15 personas):</p>
    <div id="display-room-code" class="room-code">-----</div>
    <h3>Jugadores conectados:</h3>
    <div id="player-list-lobby" class="player-list"></div>
    <button onclick="startGame()" style="margin-top: 20px;">¡Empezar Juego!</button>
  </div>

  <!-- Pantalla 3: Juego Principal -->
  <div id="screen-game" class="card hidden">
    <h2>Partida en curso</h2>
    <div id="turn-display" class="current-turn">Cargando turno...</div>
    <div id="dice-result" style="font-size: 20px; margin-bottom: 10px;"></div>
    <button id="btn-roll" onclick="rollDice()">🎲 Lanzar Dado</button>

    <h3>Posiciones:</h3>
    <div id="player-board" class="player-list"></div>
  </div>

</body>
</html>
